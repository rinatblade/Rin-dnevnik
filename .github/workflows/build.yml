name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Скачать шрифты (40 русских)
        run: python3 scripts/fetch_fonts.py

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Собрать APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Переименовать APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Rin-dnevnik.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Rin-dnevnik-apk
          path: Rin-dnevnik.apk

      - name: Выпустить релиз с APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0-${{ github.run_number }}" Rin-dnevnik.apk \
            --title "Rin-dnevnik сборка ${{ github.run_number }}" \
            --notes "Debug APK. Установите файл Rin-dnevnik.apk на телефон."
